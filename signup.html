<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Portfolio Builder</title>

    <link rel="stylesheet" href="css/signup.css">
    <link rel="stylesheet" href="css/responsive/signup-responsive.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <h1>Create Account 🚀</h1>

        <p>

            Join Portfolio Builder and create your professional portfolio in minutes.

        </p>

    </div>

    <!-- Right Side -->

    <div class="right">

        <form id="signupForm">

            <h2>Sign Up</h2>

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                type="text"
                id="name"
                placeholder="Full Name"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                id="email"
                placeholder="Email Address"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required>

            </div>

            <button type="submit">

                Create Account

            </button>

            <p>

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </form>
        <div id="toast" class="toast"></div>

    </div>

</div>

<script src="js/signup.js"></script>

</body>

</html>
