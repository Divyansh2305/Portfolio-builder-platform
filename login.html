<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Portfolio Builder</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsive/login-responsive.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://kit.fontawesome.com/6b8d5d8f6d.js" crossorigin="anonymous"></script>

</head>

<body>

    <div class="container">

        <div class="left">

            <h1>Welcome Back 👋</h1>

            <p>

                Login to continue building your professional portfolio.

            </p>

        </div>

        <div class="right">

            <form id="loginForm">

                <h2>Login</h2>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                </div>

                <button>

                    Login

                </button>
                <div id="toast" class="toast"></div>

                <p>

                    Don't have an account?

                    <a href="signup.html">

                        Sign Up

                    </a>

                </p>

            </form>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
